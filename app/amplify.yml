version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "REGION=$REGION" >> .env.production
        - echo "ACCESS_KEY=$ACCESS_KEY" >> .env.production
        - echo "SECRET_KEY=$SECRET_KEY" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - '.next/cache/**/*'